name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android project and setup dependencies
        run: |
          mv lib _lib_backup
          rm -f pubspec.yaml
          flutter create --platforms=android --project-name carb_setting --org com.my4mini.carb .
          rm -rf lib test
          mv _lib_backup lib
          sed -i 's/android:label="carb_setting"/android:label="4miniキャブ診断"/' android/app/src/main/AndroidManifest.xml
          flutter pub add shared_preferences
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 4mini-carb-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
